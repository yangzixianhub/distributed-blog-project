# 示例：将 Spring 生成的静态文章页交给 Nginx 直接返回（需与 article.reading.static-html.directory 一致或用软链指向）
#
# 假设前端跑在 8082，API 在 7010(/api)，静态文件由 article-service 写入本机目录。
#
# location 前缀需与 application.yml 中 article.reading.static-html.public-url-prefix 一致（默认 /static/articles）

server {
    listen 80;
    server_name localhost;

    # Vue打包资源或devServer反代
    # location / { proxy_pass http://127.0.0.1:8082; }

    # 静态文章页：高并发读走磁盘，不经后端
    location /static/articles/ {
        # Windows 示例路径请改为你的 article.reading.static-html.directory（或使用目录软链）
        alias D:/D/大学学习/大三下/分布式/大作业/Blog/bbs-springboot/bbs-article/bbs-article-service/article-static-html/;
        add_header Cache-Control "public, max-age=300";
    }

    # API 仍转 Spring Boot bbs-rest
    location /api/ {
        proxy_pass http://127.0.0.1:7010/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
