server:
  port: 7013

spring:
  application:
    name: ns-bbs-user
  main:
    allow-circular-references: true
  datasource:
    url: jdbc:mysql://127.0.0.1:3306/open_bbs?characterEncoding=UTF-8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    type: com.alibaba.druid.pool.DruidDataSource
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: root
    # mysql密码（需要改成你自己的）
    password: zhang060122
    # 下面为连接池的补充设置，应用到上面所有数据源中
    druid:
      initial-size: 5
      min-idle: 5
      max-active: 20
      max-wait: 60000
      time-between-eviction-runs-millis: 60000
      min-evictable-idle-time-millis: 300000
      validation-query: SELECT 1 FROM DUAL
      test-while-idle: true
      test-on-borrow: false
      test-on-return: false
      pool-prepared-statements: true
      max-pool-prepared-statement-per-connection-size: 20
      filters: wall,state
      connection-properties: druid.stat.mergeSql=true;druid.stat.slowSqlMillis=5000
      filter:
        stat:
          enabled: true
          db-type: mysql
          log-slow-sql: true
          slow-sql-millis: 2000
  data:
    redis:
      host: 139.9.78.65
      port: 6222
      password: 5LiA5Liq5Y2B5YiG5aSN5p2C55qE5a+G56CB
      # 单位 毫秒
      timeout: 60000
      lettuce:
        pool:
          max-active: 10
          max-idle: 10
          min-idle: 1

dubbo:
  application:
    name: ns-bbs-user
    register-mode: interface
    qos-enable: false
  registry:
    address: zookeeper://139.9.78.65:2181
    timeout: 60000
  protocol:
    name: dubbo
    port: 22003
  consumer:
    check: false
    timeout: 60000
  config-center:
    timeout: 60000
  provider:
    filter: -exception

mybatis:
  mapper-locations: classpath*:mybatis/mappers/*.xml

#分布式雪花ID服务
distributed-id:
  enabled: true
  base-url: http://127.0.0.1:5000
  connect-timeout-ms: 5000
  read-timeout-ms: 5000
  api-keys:
    article: blog-article-service-key
    comment: blog-comment-service-key
    like: blog-like-service-key
